name: Mock regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python version
        run: python3 --version
      - name: Run mocked SDK regressions
        run: python3 run_regressions.py
